version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mplad-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mplad_insight
    volumes:
      - mongo_data:/data/db
    networks:
      - mplad-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: mplad-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - mplad-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mplad-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/mplad_insight
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=mplad-insight-secure-jwt-secret-key-2026
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - mplad-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mplad-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - mplad-net

networks:
  mplad-net:
    driver: bridge

volumes:
  mongo_data:
